<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Quando configuramos uma CSS para o iframe dentro de style , ela é soberana, mesmo que haja dados em body */
        iframe {
            height: 400;
            width: 400;
            border: 1px solid black;
        }
    </style>
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

        <!-- tamanho padrão da borda  é 300x150px -->
         <!-- frameborder é a borda ; se quisermos podemos alterar as medidas das bordas.
          height-->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500"
        
        ><a href="https://www.cursoemvideo.com" target="_blank"></a></iframe>para aprender a programar</p>
        <p>O repositório do
            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500"><a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a></iframe>também é bem legal!
        </p>
</body>
</html>
