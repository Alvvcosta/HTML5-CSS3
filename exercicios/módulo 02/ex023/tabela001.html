<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <STYLE>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;/*  para as linhas ficarem juntas */
            border: 5px solid red;
        }
     
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;/*alinhamento horizontal*/
            vertical-align: middle;/* top, middle e botton - alinhamento vertical*/
        }
     

    </STYLE>
</head>
<body>
    <h1>
        Minha primeira tabela
    </h1>

    <!-- HIERARQUIA DE TABELAS (simples) 
     TABLE = tabela
     TABLE ROW = linha de tabela
     TABLE HEADER = cabeçalho de tabela 
     TABLE DATA = dado de tabela-->
     <table>
        <tr>
            <td>A1</td>
            <TD>B1</TD>
            <TD>C1</TD>
        </tr>
       <tr >
            <td>A2</td>
            <TD>B2</TD>
            <TD>C2</TD>
        </tr><tr>
            <td>A3</td>
            <TD>B3</TD>
            <TD>C3</TD>
        </tr><tr>
            <td>A4</td>
            <TD>B4</TD>
            <TD>C4</TD>
        </tr>
        
     </table>
</body>
</html>
